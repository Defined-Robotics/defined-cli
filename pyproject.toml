[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defined-cli"
version = "0.0.1"
description = "Defined Robotics platform orchestrator — compile, deploy, and monitor robot tasks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "defined-compiler>=0.0.1",
    "defined-rdf>=0.0.1",
    "roslibpy>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "docker>=7.0",
    "textual>=0.50",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock",
]

[project.scripts]
defined = "defined_cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/defined_cli"]

[tool.uv.sources]
defined-compiler = { git = "https://github.com/Defined-Robotics/verb-compiler", branch = "trunk" }
defined-rdf = { git = "https://github.com/Defined-Robotics/rdf", branch = "trunk" }

[tool.pytest.ini_options]
testpaths = ["tests"]
