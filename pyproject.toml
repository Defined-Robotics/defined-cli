[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defined-cli"
version = "0.0.2"
description = "Defined Robotics platform orchestrator — compile, deploy, and monitor robot tasks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "defined-compiler>=0.0.1",
    "defined-rdf>=0.0.1",
    "roslibpy>=2.0",
    "click>=8.0",
    "rich>=13.0",
]

# Optional dependency groups:
#   tui  — end-users: enables --tui flag (Textual full-screen display)
#   dev  — contributors: testing tools + all optional runtime features
[project.optional-dependencies]
tui = [
    "textual>=0.50",
]
dev = [
    "pytest>=8.0",
    "pytest-mock",
    "textual>=0.50",
]

[project.scripts]
defined = "defined_cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/defined_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
