name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "defined-rdf @ git+https://github.com/Defined-Robotics/rdf.git@trunk"
          pip install "defined-compiler @ git+https://github.com/Defined-Robotics/verb-compiler.git@trunk"
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v

  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "defined-rdf @ git+https://github.com/Defined-Robotics/rdf.git@trunk"
          pip install "defined-compiler @ git+https://github.com/Defined-Robotics/verb-compiler.git@trunk"
          pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v
